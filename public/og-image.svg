<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0806"/>
      <stop offset="100%" stop-color="#0c1018"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8D89A"/>
      <stop offset="100%" stop-color="#C9A84C"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Gold border frame -->
  <rect x="28" y="28" width="1144" height="574" rx="12" fill="none" stroke="#C9A84C" stroke-width="1.5" stroke-opacity="0.35"/>
  <rect x="36" y="36" width="1128" height="558" rx="10" fill="none" stroke="#C9A84C" stroke-width="0.5" stroke-opacity="0.15"/>

  <!-- Subtle radial glow -->
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.06"/>
    <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Gold divider top -->
  <line x1="480" y1="180" x2="720" y2="180" stroke="#C9A84C" stroke-width="0.8" stroke-opacity="0.5"/>

  <!-- Site name -->
  <text x="600" y="270" text-anchor="middle" font-family="Georgia, serif" font-size="72" font-weight="400" letter-spacing="4" fill="url(#gold)">Student Archive</text>

  <!-- Tagline -->
  <text x="600" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="300" letter-spacing="2" fill="#C4B08A" opacity="0.85">Free IGCSE &amp; A Level Past Papers</text>

  <!-- Gold divider bottom -->
  <line x1="440" y1="365" x2="760" y2="365" stroke="#C9A84C" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- Sub-subjects row -->
  <text x="600" y="415" text-anchor="middle" font-family="Georgia, serif" font-size="16" letter-spacing="3" fill="#7A6A4A" opacity="0.9">Biology · Chemistry · Physics · Mathematics · Economics · Accounting</text>

  <!-- URL badge -->
  <rect x="519" y="460" width="162" height="34" rx="6" fill="#C9A84C" fill-opacity="0.10" stroke="#C9A84C" stroke-width="1" stroke-opacity="0.3"/>
  <text x="600" y="482" text-anchor="middle" font-family="Georgia, serif" font-size="15" letter-spacing="2" fill="#C9A84C">studentarchive.xyz</text>
</svg>
